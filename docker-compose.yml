services:
  radiant-node:
    build:
      context: .
      dockerfile: docker/Dockerfile.release
      args:
        GIT_TAG: v3.1.2
        BUILD_TYPE: Release
    image: radiant-core:latest
    container_name: radiant-node
    restart: unless-stopped
    ports:
      # 7333 (P2P) is the ONLY port that should be reachable from outside.
      - "7333:7333"  # P2P
      # RPC (7332) controls the wallet — bind the host publish to localhost ONLY,
      # never 0.0.0.0. (rpcbind=0.0.0.0 inside the container is just so Docker's
      # loopback port-forward can reach it; the host publish is the real control.)
      - "127.0.0.1:7332:7332"  # RPC (localhost only — NEVER expose publicly)
      - "127.0.0.1:29000:29000"  # ZMQ (localhost only, if enabled)
    volumes:
      - radiant-data:/home/radiant/.radiant
    environment:
      # REQUIRED: put a strong RPC_PASSWORD in a .env file, e.g. `openssl rand -hex 32`.
      - RPC_USER=${RPC_USER:-radiant}
      - RPC_PASSWORD=${RPC_PASSWORD:?set a strong RPC_PASSWORD (e.g. openssl rand -hex 32) in a .env file}
    command: >
      -server
      -txindex=1
      -rpcuser=${RPC_USER:-radiant}
      -rpcpassword=${RPC_PASSWORD:?set a strong RPC_PASSWORD in a .env file}
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
    healthcheck:
      test: ["CMD", "radiant-cli", "-rpcuser=${RPC_USER:-radiant}", "-rpcpassword=${RPC_PASSWORD}", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - radiant-network

  # Optional: Radiant Seeder
  radiant-seeder:
    build:
      context: .
      dockerfile: docker/Dockerfile.seeder
      args:
        GIT_TAG: v3.1.2
    image: radiant-seeder:latest
    container_name: radiant-seeder
    restart: unless-stopped
    ports:
      - "5353:53/udp"
    command: >
      -host=dnsseed.example.com
      -ns=vps.example.com
      -mbox=admin@example.com
    networks:
      - radiant-network
    profiles:
      - seeder  # Only starts when explicitly enabled

volumes:
  radiant-data:
    driver: local

networks:
  radiant-network:
    driver: bridge
